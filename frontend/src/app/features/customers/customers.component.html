<div class="customers-container">
  <h1 class="title">Customers</h1>

  <!-- CARD 1 -->
  <div class="cards-wrapper">
    <div class="action-card" (click)="onAddCustomer()">
      <div class="card-icon">
        <mat-icon>person_add</mat-icon>
      </div>
      <h2>Add New Customer</h2>
      <p>Create and register a new customer in the system.</p>
    </div>

    <!-- CARD 2 -->
    <div class="action-card" (click)="onViewCustomers()">
      <div class="card-icon">
        <mat-icon>person_search</mat-icon>
      </div>
      <h2>Search & View Customers</h2>
      <p>Displays all customers in a structured table view.</p>
    </div>
  </div>
</div>
