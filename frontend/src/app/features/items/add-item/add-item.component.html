<div class="container">

  <app-breadcrumb [items]="breadcrumbs()"></app-breadcrumb>
  <p class="subtitle">Create a new item entry</p>

  <app-item-form
    #itemForm
    mode="create"

    [itemGroups]="itemGroups()"
    [creating]="creating()"
    
    (create)="onCreate($event)"
    (goBack)="onGoBack(itemForm)"
  >
  </app-item-form>

</div>
