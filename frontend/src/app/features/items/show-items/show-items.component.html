<div class="container">
  <app-breadcrumb [items]="breadcrumbs()"></app-breadcrumb>
  <p class="subtitle">View and manage all registered items</p>

  <div>
    <app-grid-table
      [columns]="columns"
      [data]="items()"
      [loading]="loading()"
      (refresh)="loadItems()"
      (view)="onRowClick($event)">
    </app-grid-table>
  </div>
</div>
