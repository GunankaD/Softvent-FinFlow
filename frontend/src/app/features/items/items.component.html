<div class="items-container">
  <h1 class="title">Items</h1>

  <div class="cards-wrapper">
    <div class="action-card" (click)="onAddItem()">
      <div class="card-icon">
        <mat-icon>inventory_2</mat-icon>
      </div>
      <h2>Add New Item</h2>
      <p>Create and register a new item in the system.</p>
    </div>

    <div class="action-card" (click)="onViewItems()">
      <div class="card-icon">
        <mat-icon>search</mat-icon>
      </div>
      <h2>Search & View Items</h2>
      <p>Displays all items in a structured table view.</p>
    </div>
  </div>
</div>
