<div class="login-container">
    <mat-card class="login-card">
        <h2>FinFlow</h2>
        <p class="subtitle">Start your journey with us</p>

    <!-- FORM GROUP BEGINS -->
        <form>
        <!-- EMAIL ID BEGINS-->
            <mat-form-field appearance="outline" class="full email">
                <mat-label>Email</mat-label>
                <input matInput [formControl]="email" />

                @if (email.invalid) {
                    <mat-error>{{ emailError() }}</mat-error>
                }
            </mat-form-field>
        <!-- EMAIL ID ENDS -->
        
        <!-- PASSWORD BEGINS -->
            <mat-form-field appearance="outline" class="full password">
                <mat-label>Password</mat-label>
                <input matInput type="password" [formControl]="password" />
                @if (password.invalid) {
                    <mat-error>{{ passwordError() }}</mat-error>
                }
            </mat-form-field>
        <!-- PASSWORD ENDS -->

        <!-- CREATE NEW ACCOUNT BUTTON BEGINS -->
        
            <div
                class="create-acc-btn-wrapper"
                [class.invalid]="email.invalid || password.invalid">

                <button
                    mat-raised-button
                    class="full create-acc-btn"
                    [disabled]="email.invalid || password.invalid">
                    Create Account
                </button>
            </div>
        <!-- CREATE NEW ACCOUNT BUTTON ENDS -->
        
        <!-- LOGIN BUTTON BEGINS -->
            <button
                mat-button
                class="full login-btn"
                routerLink="/login">
                Back to Login
            </button>
        <!-- LOGIN BUTTON ENDS -->

        </form>
    <!-- FORM GROUP ENDS -->

    </mat-card>
</div>
