<div class="confirm-dialog">

  <h2 class="dialog-title">
    {{ data.title }}
  </h2>

  <p class="dialog-message">
    {{ data.message }}
  </p>

  <div class="dialog-actions">
    <button
      mat-stroked-button
      class="cancel-btn"
      (click)="onCancel()">
      Cancel
    </button>

    <button
      mat-flat-button
      class="confirm-btn"
      (click)="onConfirm()">
      Delete
    </button>
  </div>

</div>
