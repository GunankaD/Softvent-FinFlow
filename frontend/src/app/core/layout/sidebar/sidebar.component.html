<aside class="sidebar" [class.open]="isOpen">
  <nav>
    <a routerLink="/" routerLinkActive="active"
       [routerLinkActiveOptions]="{ exact: true }"
       (click)="onLinkClick()">
      <mat-icon fontSet="material-symbols-outlined">dashboard</mat-icon>
      <span>Dashboard</span>
    </a>

    <a routerLink="/customers" routerLinkActive="active" 
        (click)="onLinkClick()">
      <mat-icon fontSet="material-symbols-outlined">groups</mat-icon> 
      <span>Customers</span> 
    </a>

    <a routerLink="/items" routerLinkActive="active"
       (click)="onLinkClick()">
      <mat-icon fontSet="material-symbols-outlined">inventory_2</mat-icon>
      <span>Items</span>
    </a>

    <a routerLink="/transactions" routerLinkActive="active"
       (click)="onLinkClick()">
      <mat-icon fontSet="material-symbols-outlined">receipt_long</mat-icon>
      <span>Transactions</span>
    </a>

    <a routerLink="/reports" routerLinkActive="active"
       (click)="onLinkClick()">
      <mat-icon fontSet="material-symbols-outlined">bar_chart</mat-icon>
      <span>Reports</span>
    </a>

    <a routerLink="/settings" routerLinkActive="active"
       (click)="onLinkClick()">
      <mat-icon fontSet="material-symbols-outlined">settings</mat-icon>
      <span>Settings</span>
    </a>

  </nav>
</aside>
